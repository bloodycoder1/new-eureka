name : Testing the JS With the JEST
on: 
  push:
jobs: 
    setup: 
      runs-on: ubuntu-latest

      steps:
          - name: Checkout code
            uses: actions/checkout@v4
          - name: Setup Node
            uses: actions/setup-node@v4
            with:
              node-version: 22
          - name: Getting Node Versions
            run: node --version 
          - name: Install Dependencies
            run: npm ci 
          
          - name: The Success Statement
            if: success()
            run: echo " This will work with the sucess"  

          - name: Test Code 
            run: npm test 
          - name: Handle failure
            if: failure()
            run: echo "This is the Error We have GOT"

          - name: always will work 
            if: always()
            run: echo "This is going to run always"
    build:
      needs: setup
      runs-on: ubuntu-latest 
      steps:
        - name: Checkout code
          uses: actions/checkout@v4 

        - name: Setup node 
          uses: actions/setup-node@v4 
          with:
            node-version: 22
        - name: Install Dependencies
          run: npm ci
        - name: Build 
          run: echo "WE are Just Building the App"