name : Node Information
on: 
  push: 
jobs: 
  info: 
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup the Node 
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Show Node Versions
        run: node --version
      - name: Install Dependencies
        run: npm i
      - name: Run Application 
        run: npm start 