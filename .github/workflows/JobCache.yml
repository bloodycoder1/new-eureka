name: CI 

on: 
  push:
  workflow_dispatch:
jobs:
  install:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node and Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Dependencies
        run: npm ci 
      - name: Show Cache Information 
        run: echo "dependencies Installed in install Job"
  test:
    needs: install 
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup the Node
        uses: actions/setup-node@v4 
        with: 
          node-version: 22
          cache: npm 
      - name: Install Dependencies
        run: npm ci
      - name: run tests
        run: npm test